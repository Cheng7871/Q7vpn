<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q7vpn · 账户</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><script>try{document.documentElement.dataset.theme=localStorage.getItem('q7theme')||'dark'}catch(e){}</script></head><body><main class="wrap auth-wrap"><div class="center"><div class="logo">◈</div><h1 class="brand">Q7vpn</h1><p class="sub">安全 · 简约 · 节点管理</p></div><div class="tabs"><a class="{{ 'active' if mode!='register' else '' }}" href="{{ url_for('auth',mode='login') }}">登录</a><a class="{{ 'active' if mode=='register' else '' }}" href="{{ url_for('auth',mode='register') }}">注册</a></div>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}<form method="post" class="card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="mode" value="{{ 'register' if mode=='register' else 'login' }}"><input class="field" name="username" placeholder="用户名" autocomplete="username" required minlength="3" maxlength="32"><input class="field" name="password" type="password" placeholder="密码（至少 10 位）" autocomplete="{{ 'new-password' if mode=='register' else 'current-password' }}" required minlength="10">{% if mode=='register' %}<input class="field" name="phone" placeholder="手机号（用于找回账户）" autocomplete="tel" required><select class="field" name="question" required><option value="">选择安全问题（找回密码时验证）</option><option>我童年最喜欢的老师姓什么？</option><option>我第一只宠物叫什么？</option><option>我最喜欢的城市是哪里？</option></select><input class="field" name="answer" placeholder="安全答案（请妥善保管）" required minlength="2"><p class="small">当前版本不会发送短信验证码。安全问题答案应使用不容易被猜到的独立答案。</p>{% endif %}<button class="btn" type="submit">{{ '创建账户' if mode=='register' else '登录 Q7vpn' }}</button><p class="small center"><a href="{{ url_for('recover') }}">忘记密码？</a>　·　<button type="button" class="theme-toggle" onclick="toggleTheme()">切换黑/白主题</button></p></form><p class="small center">登录状态会在本设备保留一段时间。请勿在公共设备勾选或保存账户信息。</p><p class="footer">Q7vpn · V3</p></main><script>function toggleTheme(){let t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;localStorage.setItem('q7theme',t)}</script></body></html>
