<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NodeBox</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#111;background:#f5f5f7}
*{box-sizing:border-box}body{margin:0}.app{max-width:1100px;margin:auto;padding:22px 16px 50px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.brand{font-size:28px;font-weight:800;letter-spacing:-.7px}.sub{color:#777;font-size:13px;margin-top:3px}
button{border:0;border-radius:14px;padding:11px 15px;background:#111;color:white;font-weight:650;cursor:pointer}
button.secondary{background:#e8e8ed;color:#111}button.danger{background:#ffe5e5;color:#b00020}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tab{background:#e8e8ed;color:#555}.tab.active{background:#111;color:white}
.card{background:white;border:1px solid #e5e5e8;border-radius:22px;padding:18px;box-shadow:0 8px 30px #00000008;margin-bottom:14px}
.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:15px}.muted{color:#777}.big{font-size:22px;font-weight:750}
.search{width:100%;border:1px solid #ddd;border-radius:15px;padding:13px 15px;font-size:15px;outline:none;background:#fafafa}
.nodes{display:grid;gap:10px}.node{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:15px;border:1px solid #eee;border-radius:18px}
.node:hover{background:#fafafa}.name{font-weight:700}.meta{font-size:12px;color:#777;margin-top:5px;word-break:break-all}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef0ff;color:#3949ab;font-size:11px;margin-right:5px}
.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.actions button{padding:8px 10px;font-size:12px}
textarea{width:100%;min-height:210px;border:1px solid #ddd;border-radius:16px;padding:14px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
.empty{text-align:center;padding:45px 15px;color:#777}.hidden{display:none!important}
.footer{color:#999;text-align:center;font-size:12px;margin-top:28px}
@media(max-width:650px){.hero{grid-template-columns:1fr}.node{grid-template-columns:1fr}.actions{justify-content:flex-start}}
</style>
</head>
<body>
<div class="app">
<header><div><div class="brand">NodeBox</div><div class="sub">简约节点管理器 · SS / VLESS</div></div>
<button class="secondary" onclick="showTab('settings')">设置</button></header>

<div class="tabs">
<button class="tab active" data-tab="nodes" onclick="showTab('nodes')">节点</button>
<button class="tab" data-tab="import" onclick="showTab('import')">导入</button>
<button class="tab" data-tab="add" onclick="showTab('add')">添加</button>
<button class="tab" data-tab="settings" onclick="showTab('settings')">关于</button>
</div>

<section id="nodes">
<div class="card hero"><div><div class="muted">节点总数</div><div class="big" id="count">0</div></div>
<button onclick="showTab('import')">导入 TXT</button></div>
<div class="card"><input class="search" id="search" placeholder="搜索节点名称、地址、协议…" oninput="render()"></div>
<div class="nodes" id="list"></div>
</section>

<section id="import" class="hidden">
<div class="card"><h2>导入 TXT</h2><p class="muted">每行放一个节点 URI。当前支持 ss:// 和 vless://。</p>
<input type="file" id="file" accept=".txt,.conf,.list" onchange="readFile(this)">
<textarea id="importText" placeholder="也可以直接把节点文本粘贴到这里"></textarea>
<br><br><button onclick="importText()">解析并导入</button></div>
</section>

<section id="add" class="hidden">
<div class="card"><h2>手动添加</h2><p class="muted">粘贴一个完整的 ss:// 或 vless:// 节点 URI。</p>
<textarea id="one" style="min-height:120px" placeholder="vless://..."></textarea>
<br><br><button onclick="addOne()">添加节点</button></div>
</section>

<section id="settings" class="hidden">
<div class="card"><h2>NodeBox</h2><p>这是一个节点整理/解析前端。节点数据默认保存在当前浏览器的 localStorage。</p>
<p class="muted">本版本不会自动连接 VPN，也不会代你登录第三方服务；它负责导入、解析、搜索、收藏、删除和复制节点配置。</p>
<button class="danger" onclick="clearAll()">清空本机节点</button></div>
</section>
<div class="footer">NodeBox · Render Ready</div>
</div>

<script>
const KEY="nodebox.nodes.v1"; let nodes=JSON.parse(localStorage.getItem(KEY)||"[]");
function save(){localStorage.setItem(KEY,JSON.stringify(nodes));}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=document.getElementById("list");
 const arr=nodes.filter(n=>JSON.stringify(n).toLowerCase().includes(q));
 document.getElementById("count").textContent=nodes.length;
 if(!arr.length){list.innerHTML='<div class="card empty">暂无节点<br><small>点击“导入 TXT”开始</small></div>';return}
 list.innerHTML=arr.map(n=>`<div class="node"><div><div class="name">${esc(n.name||"未命名")}</div>
 <div style="margin-top:6px"><span class="pill">${esc(n.type)}</span><span class="pill">${esc(n.host)}:${esc(n.port)}</span></div>
 <div class="meta">${esc(n.uri)}</div></div><div class="actions">
 <button class="secondary" onclick="copyNode('${n.id}')">复制</button>
 <button class="danger" onclick="delNode('${n.id}')">删除</button></div></div>`).join("");
}
function showTab(id){document.querySelectorAll("section").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===id));}
async function importText(){
 const text=document.getElementById("importText").value.trim(); if(!text)return alert("先粘贴节点文本");
 const r=await fetch("/api/import",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({text})});
 const d=await r.json(); nodes=[...nodes,...d.nodes]; save(); render(); alert(`成功解析 ${d.count} 个节点`); showTab("nodes");
}
async function readFile(input){const f=input.files[0];if(!f)return;document.getElementById("importText").value=await f.text();}
async function addOne(){
 const uri=document.getElementById("one").value.trim(); if(!uri)return;
 const r=await fetch("/api/parse",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({uri})});
 const d=await r.json(); if(!r.ok)return alert(d.error||"解析失败"); nodes.push(d);save();render();document.getElementById("one").value="";showTab("nodes");
}
function copyNode(id){const n=nodes.find(x=>x.id===id);navigator.clipboard.writeText(n.uri).then(()=>alert("节点已复制"))}
function delNode(id){nodes=nodes.filter(x=>x.id!==id);save();render();}
function clearAll(){if(confirm("确定清空当前浏览器保存的全部节点？")){nodes=[];save();render();}}
render();
</script>
</body>
</html>
